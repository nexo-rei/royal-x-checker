[project]
name = "royal-x-checker"
version = "0.1.0"
description = "Telegram payment-security testing lab using synthetic data and authorized sandbox integrations"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=21.10,<23.0",
  "SQLAlchemy>=2.0.36,<3.0",
  "greenlet>=3.0,<4.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long UI copy and generated migration statements are split for readability where practical.
ignore = ["E501"]
